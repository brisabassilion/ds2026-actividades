<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo</title>
</head>
<body>
    <h1>Catálogo</h1>
    <input type="text" id="filtroAutor">
    <button id="filtrar">Filtrar</button>
    <button id="mostrarDisponibles">Solo disponibles</button>
    <button id="mostrarTodos">Ver todos</button>
    <ul id="listado"></ul>
    <p id="stats"></p>

    <h2>Agregar nuevo libro</h2>

    <form id="formulario">
        <input type="text" id="titulo" placeholder="Título" required>
        <input type="text" id="autor" placeholder="Autor" required>
        <input type="number" id="precio" placeholder="Precio" required>
        <input type="text" id="género" placeholder="Género" required>
        <input type="checkbox" id="disponible"> Disponible
        <button type="submit">Agregar libro</button>
    </form>
    <div id="errorForm"></div>
    <script src=./app.js></script>
</body>
</html>
